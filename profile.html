<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div class="sidebar-overlay"></div>
  <div class="app-layout page-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="top-header" id="top-header"></header>
      <main class="page-content">
        <div class="grid grid-3 reveal" style="margin-bottom:1.5rem">
          <div class="glass-card" style="grid-column:span 1;text-align:center;padding:2rem">
            <div class="avatar avatar-lg" style="width:80px;height:80px;font-size:2rem;margin:0 auto 1rem">AD</div>
            <h2>Admin User</h2>
            <p style="color:var(--text-secondary)">Platform Administrator</p>
            <div class="stars" style="margin:0.5rem 0">★★★★★</div>
            <span class="badge badge-primary">Pro Plan</span>
          </div>
          <div class="glass-card" style="grid-column:span 2">
            <h3 style="margin-bottom:1rem">Profile Information</h3>
            <div class="grid grid-2">
              <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" value="Admin User"></div>
              <div class="form-group"><label class="form-label">Email</label><input class="form-input" value="admin@demo-platform.example"></div>
              <div class="form-group"><label class="form-label">Phone</label><input class="form-input" value="+1 (555) 000-0000"></div>
              <div class="form-group"><label class="form-label">Role</label><input class="form-input" value="Administrator" readonly></div>
            </div>
            <button class="btn btn-primary" onclick="App.toast('Profile updated','success')">Update Profile</button>
          </div>
        </div>
        <div class="grid grid-2 reveal">
          <div class="loyalty-card glass-card"><div style="font-size:0.875rem;opacity:0.9">Loyalty Points</div><div class="loyalty-points">2,450</div><p>Gold Member · 550 pts to Platinum</p></div>
          <div class="glass-card">
            <h3 style="margin-bottom:1rem">Booking Statistics</h3>
            <div class="grid grid-2" style="gap:1rem">
              <div class="stat-card glass-card" style="padding:1rem"><div class="stat-value" style="font-size:1.5rem">47</div><div class="stat-label">My Bookings</div></div>
              <div class="stat-card glass-card" style="padding:1rem"><div class="stat-value" style="font-size:1.5rem">$3,240</div><div class="stat-label">Total Spent</div></div>
            </div>
          </div>
        </div>
        <div class="glass-card reveal" style="margin-top:1.5rem">
          <h3 style="margin-bottom:1rem">Recent Appointments</h3>
          <div class="appt-list" id="profile-appts"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/themes.js"></script>
  <script>
    App.initAppLayout('Profile', 'Your account and booking history');
    document.getElementById('profile-appts').innerHTML = DataStore.appointments.slice(0, 10).map(a => `
      <div class="appt-item"><div class="appt-color" style="background:${a.color}"></div><div class="appt-time">${a.date}<br>${a.time}</div>
      <div style="flex:1"><strong>${a.serviceName}</strong><br><span style="font-size:0.75rem;color:var(--text-secondary)">${a.staffName}</span></div>${App.getStatusBadge(a.status)}</div>`).join('');
  </script>
</body>
</html>
