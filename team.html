<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Scheduling - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div class="sidebar-overlay"></div>
  <div class="app-layout page-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="top-header" id="top-header"></header>
      <main class="page-content">
        <div class="page-header reveal">
          <div><h2 class="page-title">Team Scheduling</h2><p class="page-subtitle">12 staff members · Shift management</p></div>
          <button class="btn btn-primary">+ Add Staff</button>
        </div>
        <div class="dashboard-grid reveal" style="grid-template-columns:repeat(4,1fr)">
          <div class="glass-card stat-card"><div class="stat-value">12</div><div class="stat-label">Team Members</div></div>
          <div class="glass-card stat-card"><div class="stat-value">89%</div><div class="stat-label">Avg Utilization</div></div>
          <div class="glass-card stat-card"><div class="stat-value">2,570</div><div class="stat-label">Total Bookings</div></div>
          <div class="glass-card stat-card"><div class="stat-value">4.8★</div><div class="stat-label">Team Rating</div></div>
        </div>
        <div class="team-grid reveal" id="team-grid" style="margin:1.5rem 0"></div>
        <div class="grid grid-2 reveal">
          <div class="glass-card"><h3 style="margin-bottom:1rem">Workload Analytics</h3><div id="workload-chart"></div></div>
          <div class="glass-card"><h3 style="margin-bottom:1rem">Travel Time Estimation</h3>
            <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:1rem">Buffer time between appointments</p>
            <div class="form-group"><label class="form-label">Default travel buffer</label><select class="form-select"><option>15 minutes</option><option>30 minutes</option><option>45 minutes</option></select></div>
            <div id="travel-estimates"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/scheduler.js"></script>
  <script>
    App.initAppLayout('Team Scheduling', 'Staff management and shift planning');
    TeamScheduler.init();
    document.getElementById('travel-estimates').innerHTML = DataStore.staff.slice(0, 5).map(s => `
      <div style="display:flex;justify-content:space-between;padding:0.5rem 0;font-size:0.875rem"><span>${s.name.split(' ')[0]}</span><span>${rand(10,30)} min avg</span></div>`).join('');
    function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  </script>
</body>
</html>
