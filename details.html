<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Details - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div class="sidebar-overlay"></div>
  <div class="app-layout page-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="top-header" id="top-header"></header>
      <main class="page-content">
        <div id="booking-detail" class="reveal"></div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/themes.js"></script>
  <script>
    App.initAppLayout('Booking Details', 'Appointment information');
    const id = new URLSearchParams(location.search).get('id');
    const appt = DataStore.appointments.find(a => a.id === id) || DataStore.appointments[0];
    document.getElementById('booking-detail').innerHTML = `
      <div class="page-header"><div><h2 class="page-title">${appt.serviceName}</h2><p class="page-subtitle">Booking ${appt.id}</p></div>
      <div style="display:flex;gap:0.5rem">${App.getStatusBadge(appt.status)}
        <button class="btn btn-secondary btn-sm" onclick="App.toast('Reschedule modal','info')">Reschedule</button>
        <button class="btn btn-ghost btn-sm" onclick="App.toast('Booking cancelled','warning')">Cancel</button></div></div>
      <div class="grid grid-2">
        <div class="glass-card">
          <h3 style="margin-bottom:1rem">Appointment Info</h3>
          <div style="display:grid;gap:0.75rem">
            <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Date</span><strong>${App.formatDate(appt.date)}</strong></div>
            <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Time</span><strong>${appt.time}</strong></div>
            <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Duration</span><strong>${appt.duration} minutes</strong></div>
            <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Price</span><strong>${App.formatCurrency(appt.price)}</strong></div>
            <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Category</span><span class="badge badge-primary">${appt.category}</span></div>
          </div>
        </div>
        <div class="glass-card">
          <h3 style="margin-bottom:1rem">People</h3>
          <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem"><div class="avatar avatar-lg">${appt.customerName.split(' ').map(n=>n[0]).join('').slice(0,2)}</div><div><strong>${appt.customerName}</strong><br><span style="font-size:0.75rem;color:var(--text-secondary)">Customer</span></div></div>
          <div style="display:flex;align-items:center;gap:1rem"><div class="avatar avatar-lg">${appt.staffName.split(' ').map(n=>n[0]).join('').slice(0,2)}</div><div><strong>${appt.staffName}</strong><br><span style="font-size:0.75rem;color:var(--text-secondary)">Staff</span></div></div>
        </div>
      </div>
      <div class="glass-card" style="margin-top:1.5rem"><h3 style="margin-bottom:0.5rem">Notes</h3><p style="color:var(--text-secondary)">${appt.notes || 'No notes for this appointment.'}</p></div>
      <div style="margin-top:1.5rem;display:flex;gap:0.5rem">
        <a href="video.html" class="btn btn-primary">Start Video Call</a>
        <a href="payments.html" class="btn btn-secondary">View Payment</a>
        <button class="btn btn-ghost" onclick="window.print()">Print Details</button>
      </div>`;
  </script>
</body>
</html>
