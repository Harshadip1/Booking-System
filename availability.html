<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div class="sidebar-overlay"></div>
  <div class="app-layout page-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="top-header" id="top-header"></header>
      <main class="page-content">
        <div class="page-header reveal">
          <div><h2 class="page-title">Availability Management</h2><p class="page-subtitle">Manage working hours and time slots</p></div>
          <div style="display:flex;gap:0.5rem;align-items:center">
            <span>Vacation Mode</span>
            <div class="toggle" id="vacation-toggle"></div>
          </div>
        </div>
        <div class="glass-card reveal" style="margin-bottom:1.5rem">
          <div class="form-group"><label class="form-label">Select Staff Member</label>
            <select class="form-select" id="staff-select" style="max-width:300px"></select>
          </div>
          <h3 style="margin:1rem 0">Weekly Schedule Editor</h3>
          <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:1rem">Click cells to toggle: Available → Break → Unavailable</p>
          <div id="availability-editor"></div>
        </div>
        <div class="grid grid-2 reveal">
          <div class="glass-card">
            <h3 style="margin-bottom:1rem">Working Hours</h3>
            <div class="form-group"><label class="form-label">Start Time</label><input class="form-input" type="time" value="08:00"></div>
            <div class="form-group"><label class="form-label">End Time</label><input class="form-input" type="time" value="18:00"></div>
            <h4 style="margin:1rem 0 0.5rem">Timeline Editor</h4>
            <div class="timeline-editor"><div class="timeline-block" style="left:10%;width:70%"><div class="timeline-handle left"></div><div class="timeline-handle right"></div></div></div>
          </div>
          <div class="glass-card">
            <h3 style="margin-bottom:1rem">Break Schedules</h3>
            <div id="break-list"></div>
            <button class="btn btn-secondary btn-sm" style="margin-top:1rem">+ Add Break</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/scheduler.js"></script>
  <script>
    App.initAppLayout('Availability', 'Working hours and schedule management');
    document.getElementById('staff-select').innerHTML = DataStore.staff.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    TeamScheduler.initAvailability();
    document.getElementById('break-list').innerHTML = ['Lunch Break 12:00-13:00','Coffee Break 15:00-15:15','Team Meeting 16:00-16:30'].map(b => `
      <div style="display:flex;justify-content:space-between;padding:0.75rem;border-bottom:1px solid var(--border)"><span>${b}</span><button class="btn btn-ghost btn-sm">Edit</button></div>`).join('');
  </script>
</body>
</html>
