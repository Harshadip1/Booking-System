<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div class="sidebar-overlay"></div>
  <div class="app-layout page-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="top-header" id="top-header"></header>
      <main class="page-content">
        <div class="page-header reveal"><div><h2 class="page-title">Service Categories</h2><p class="page-subtitle">15 services across 6 categories</p></div><button class="btn btn-primary">+ Add Service</button></div>
        <div class="tabs reveal" id="category-tabs"></div>
        <div class="service-grid reveal" id="services-grid"></div>
        <div class="glass-card reveal" style="margin-top:2rem">
          <h3 style="margin-bottom:1rem">All Services Table</h3>
          <div class="table-wrap"><table><thead><tr><th>Service</th><th>Category</th><th>Duration</th><th>Price</th><th>Bookings</th><th>Status</th></tr></thead><tbody id="services-table"></tbody></table></div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/themes.js"></script>
  <script>
    App.initAppLayout('Services', 'Manage service categories and offerings');
    let filter = 'all';
    function render() {
      const list = filter === 'all' ? DataStore.services : DataStore.services.filter(s => s.category === filter);
      document.getElementById('services-grid').innerHTML = list.map(s => `
        <div class="service-card glass-card"><div class="service-icon">${s.icon}</div><strong>${s.name}</strong>
        <p style="font-size:0.75rem;color:var(--text-secondary)">${s.duration} min</p><p style="font-weight:700;color:var(--accent)">${App.formatCurrency(s.price)}</p>
        <span class="badge badge-primary">${s.category}</span></div>`).join('');
      document.getElementById('services-table').innerHTML = DataStore.services.map(s => {
        const count = DataStore.appointments.filter(a => a.serviceId === s.id).length;
        return `<tr><td>${s.icon} ${s.name}</td><td><span class="badge badge-primary">${s.category}</span></td><td>${s.duration} min</td><td>${App.formatCurrency(s.price)}</td><td>${count}</td><td><span class="badge badge-success">Active</span></td></tr>`;
      }).join('');
    }
    document.getElementById('category-tabs').innerHTML = ['all', ...DataStore.categories].map(c => 
      `<button class="tab ${c === 'all' ? 'active' : ''}" data-cat="${c}">${c === 'all' ? 'All' : c.charAt(0).toUpperCase() + c.slice(1)}</button>`).join('');
    document.querySelectorAll('#category-tabs .tab').forEach(t => t.addEventListener('click', () => {
      filter = t.dataset.cat; document.querySelectorAll('#category-tabs .tab').forEach(x => x.classList.remove('active')); t.classList.add('active'); render();
    }));
    render();
  </script>
</body>
</html>
