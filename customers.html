<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div class="sidebar-overlay"></div>
  <div class="app-layout page-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="top-header" id="top-header"></header>
      <main class="page-content">
        <div class="page-header reveal">
          <div><h2 class="page-title">Customer Management</h2><p class="page-subtitle" id="customer-count">250 customers</p></div>
          <button class="btn btn-primary">+ Add Customer</button>
        </div>
        <div class="filters-bar reveal">
          <div class="search-box" style="flex:1;max-width:400px"><span>🔍</span><input type="text" id="customer-search" placeholder="Search customers..."></div>
          <select class="form-select" id="status-filter" style="width:auto"><option value="all">All Status</option><option value="active">Active</option><option value="vip">VIP</option><option value="inactive">Inactive</option></select>
        </div>
        <div class="customer-grid reveal" id="customer-grid"></div>
        <div id="customer-pagination"></div>
        <div class="glass-card reveal" style="margin-top:2rem">
          <h3 style="margin-bottom:1rem">Customer Table View</h3>
          <div class="table-wrap" id="customer-table"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/customers.js"></script>
  <script>
    App.initAppLayout('Customers', 'Manage customer profiles and booking history');
    CustomerManager.init();
  </script>
</body>
</html>
