<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Center - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div class="sidebar-overlay"></div>
  <div class="app-layout page-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="top-header" id="top-header"></header>
      <main class="page-content">
        <div class="glass-card reveal" style="border-color:var(--success);margin-bottom:1.5rem;padding:1rem;display:flex;align-items:center;gap:1rem">
          <span style="font-size:1.5rem">🛡️</span><div><strong>Security Status: Good</strong><br><span style="font-size:0.875rem;color:var(--text-secondary)">Your account is protected with recommended security settings.</span></div>
        </div>
        <div class="grid grid-2 reveal">
          <div class="glass-card"><h3 style="margin-bottom:1rem">Login Activity</h3><div class="table-wrap"><table><thead><tr><th>Device</th><th>Location</th><th>Time</th><th>Status</th></tr></thead><tbody id="login-activity"></tbody></table></div></div>
          <div class="glass-card"><h3 style="margin-bottom:1rem">Device Management</h3><div id="devices-list"></div></div>
        </div>
        <div class="grid grid-2 reveal" style="margin-top:1.5rem">
          <div class="glass-card"><h3 style="margin-bottom:1rem">Privacy Controls</h3>
            <div class="form-group" style="display:flex;justify-content:space-between"><span>Profile visibility</span><div class="toggle active"></div></div>
            <div class="form-group" style="display:flex;justify-content:space-between"><span>Share analytics</span><div class="toggle"></div></div>
            <div class="form-group" style="display:flex;justify-content:space-between"><span>Two-factor authentication</span><div class="toggle active"></div></div>
          </div>
          <div class="glass-card"><h3 style="margin-bottom:1rem">Security Alerts</h3><div id="security-alerts"></div></div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/themes.js"></script>
  <script>
    App.initAppLayout('Security Center', 'Account security and privacy');
    document.getElementById('login-activity').innerHTML = DataStore.loginActivity.map(l => `
      <tr><td>${l.device}</td><td>${l.location}</td><td>${l.time}</td><td><span class="badge badge-${l.status === 'success' ? 'success' : 'danger'}">${l.status}</span></td></tr>`).join('');
    document.getElementById('devices-list').innerHTML = DataStore.devices.map(d => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem 0;border-bottom:1px solid var(--border)">
        <div><strong>${d.name}</strong>${d.current ? ' <span class="badge badge-success">Current</span>' : ''}<br><span style="font-size:0.75rem;color:var(--text-secondary)">${d.location} · ${d.lastActive}</span></div>
        ${!d.current ? '<button class="btn btn-ghost btn-sm">Revoke</button>' : ''}
      </div>`).join('');
    document.getElementById('security-alerts').innerHTML = [
      { msg: 'New login from Windows Desktop', time: '2 min ago', type: 'info' },
      { msg: 'Password changed successfully', time: '3 days ago', type: 'success' },
      { msg: 'Failed login attempt blocked', time: '1 week ago', type: 'warning' }
    ].map(a => `<div style="padding:0.75rem 0;border-bottom:1px solid var(--border)"><span class="badge badge-${a.type === 'warning' ? 'warning' : 'primary'}">${a.type}</span> ${a.msg}<br><span style="font-size:0.75rem;color:var(--text-muted)">${a.time}</span></div>`).join('');
  </script>
</body>
</html>
