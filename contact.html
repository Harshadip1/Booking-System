<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="landing">
  <div class="particles"></div>
  <nav class="landing-nav scrolled">
    <a href="index.html" class="nav-logo">ScheduleHub</a>
    <div style="display:flex;gap:0.75rem"><a href="index.html" class="btn btn-ghost">Home</a><a href="dashboard.html" class="btn btn-primary">Dashboard</a></div>
  </nav>
  <section class="section page-wrapper" style="padding-top:8rem">
    <h1 class="section-title">Contact Us</h1>
    <p class="section-subtitle">Get in touch with our team (demo form)</p>
    <div class="glass-card reveal" style="max-width:600px;margin:0 auto;padding:2rem">
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" placeholder="Your name"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" placeholder="you@example.com"></div>
      <div class="form-group"><label class="form-label">Subject</label><select class="form-select"><option>General Inquiry</option><option>Technical Support</option><option>Sales</option><option>Partnership</option></select></div>
      <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" rows="5" placeholder="How can we help?"></textarea></div>
      <button class="btn btn-primary" style="width:100%" onclick="alert('Thank you! This is a demo form.')">Send Message</button>
    </div>
    <div class="grid grid-3 reveal" style="margin-top:3rem;max-width:800px;margin-left:auto;margin-right:auto">
      <div class="glass-card" style="text-align:center;padding:1.5rem"><div style="font-size:1.5rem">📧</div><strong>Email</strong><p style="color:var(--text-secondary);font-size:0.875rem">support@demo-platform.example</p></div>
      <div class="glass-card" style="text-align:center;padding:1.5rem"><div style="font-size:1.5rem">💬</div><strong>Live Chat</strong><p style="color:var(--text-secondary);font-size:0.875rem">Available 24/7 (demo)</p></div>
      <div class="glass-card" style="text-align:center;padding:1.5rem"><div style="font-size:1.5rem">📍</div><strong>Office</strong><p style="color:var(--text-secondary);font-size:0.875rem">Demo City, DC 00000</p></div>
    </div>
  </section>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
