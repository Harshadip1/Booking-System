<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Profiles - ScheduleHub</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="particles"></div>
  <div class="sidebar-overlay"></div>
  <div class="app-layout page-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="top-header" id="top-header"></header>
      <main class="page-content">
        <div class="page-header reveal"><div><h2 class="page-title">Staff Profiles</h2><p class="page-subtitle">12 team members</p></div></div>
        <div class="team-grid reveal" id="staff-profiles"></div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/themes.js"></script>
  <script>
    App.initAppLayout('Staff Profiles', 'Team member directory');
    document.getElementById('staff-profiles').innerHTML = DataStore.staff.map(s => {
      const appts = DataStore.appointments.filter(a => a.staffId === s.id).length;
      return `<div class="glass-card" style="padding:1.5rem;text-align:center">
        <div class="avatar avatar-lg" style="margin:0 auto 1rem;width:72px;height:72px;font-size:1.5rem">${s.avatar}</div>
        <h3>${s.name}</h3><p style="color:var(--text-secondary);font-size:0.875rem">${s.role} · ${s.dept}</p>
        <div class="stars" style="margin:0.5rem 0">${'★'.repeat(Math.floor(s.rating))} ${s.rating}</div>
        <div style="display:flex;justify-content:center;gap:1.5rem;margin:1rem 0;font-size:0.875rem">
          <div><strong>${appts}</strong><br><span style="color:var(--text-muted);font-size:0.75rem">Bookings</span></div>
          <div><strong>${s.bookings}</strong><br><span style="color:var(--text-muted);font-size:0.75rem">Total</span></div>
        </div>
        <a href="booking.html" class="btn btn-primary btn-sm">Book with ${s.name.split(' ')[0]}</a>
      </div>`;
    }).join('');
  </script>
</body>
</html>
